<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>麺屋 あきのそら ｜ 岡崎市大門のらーめん店</title>
<meta name="description" content="愛知県岡崎市大門のらーめん店「麺屋 あきのそら」。無化調・自家製麺・地産地消。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@500;700;900&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ===== いろ と もじ ===== */
:root{
  --sora:#A9CBE3;      /* あきのそら */
  --sora-usui:#EEF4F8; /* うすいそら */
  --kami:#FBFCFD;      /* かみ */
  --sumi:#1C2B3B;      /* すみ（もじ） */
  --usuzumi:#5A6B7C;   /* うすずみ */
  --hatcho:#6A2B1D;    /* はっちょうみそ */
  --shio:#B8903A;      /* しおスープのきんいろ */
  --sen:#D5E2EC;       /* せん */
  --mincho:"Zen Old Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --gothic:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--kami);color:var(--sumi);font-family:var(--gothic);font-size:16px;line-height:1.85;-webkit-text-size-adjust:100%}
a{color:var(--hatcho)}
a:focus-visible,button:focus-visible{outline:3px solid var(--shio);outline-offset:3px}

/* ===== いちばんうえ（そら） ===== */
.hero{
  position:relative;min-height:92vh;min-height:92svh;
  background:linear-gradient(180deg,#8DB8D8 0%,var(--sora) 38%,var(--sora-usui) 88%,var(--kami) 100%);
  display:grid;grid-template-columns:1fr auto;align-items:start;
  padding:12vh 7vw 8vh;overflow:hidden;
}
.hero__name{
  writing-mode:vertical-rl;font-family:var(--mincho);font-weight:900;
  font-size:clamp(64px,17vw,150px);line-height:1.05;letter-spacing:.08em;margin:0;
  color:var(--sumi);grid-column:2;grid-row:1 / span 2;
  animation:tachinobori 1.6s cubic-bezier(.2,.7,.2,1) both;
}
.hero__name small{font-size:.34em;letter-spacing:.3em;font-weight:700;margin-block-end:.6em;display:inline-block}
.hero__side{grid-column:1;grid-row:1;align-self:end;max-width:15em;padding-top:30vh}
.hero__place{font-family:var(--mincho);font-size:15px;letter-spacing:.2em;margin:0 0 1.2em}
.kodawari{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.35em}
.kodawari li{font-family:var(--mincho);font-weight:700;font-size:clamp(20px,5.2vw,28px);letter-spacing:.12em}
.hanko{
  position:absolute;left:7vw;bottom:6vh;width:64px;height:64px;border:2px solid var(--hatcho);
  color:var(--hatcho);font-family:var(--mincho);font-weight:700;font-size:13px;line-height:1.3;
  display:grid;place-items:center;text-align:center;transform:rotate(-6deg);border-radius:4px
}
@keyframes tachinobori{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.hero__name{animation:none}html{scroll-behavior:auto}}

/* ===== ほんぶん ===== */
main{max-width:680px;margin:0 auto;padding:0 22px 40px}
section{padding:64px 0 8px}
h2{font-family:var(--mincho);font-weight:700;font-size:28px;letter-spacing:.14em;margin:0 0 28px;
  display:flex;align-items:center;gap:14px}
h2::after{content:"";flex:1;height:1px;background:var(--sen)}
p{margin:0 0 1.1em}

/* みせのこと */
.story p{font-size:17px}
.shou{margin-top:24px;padding:16px 18px;border-left:3px solid var(--shio);background:var(--sora-usui);font-size:15px}
.shou p{margin:0}

/* おしながき */
.menu{list-style:none;margin:0;padding:0}
.menu li{padding:18px 0;border-bottom:1px solid var(--sen)}
.menu__row{display:flex;align-items:baseline;gap:10px}
.menu__name{font-family:var(--mincho);font-weight:700;font-size:20px;letter-spacing:.06em}
.menu__dots{flex:1;border-bottom:2px dotted #B9C8D4;transform:translateY(-5px);min-width:20px}
.menu__price{font-family:var(--mincho);font-weight:700;font-size:18px;white-space:nowrap}
.menu__desc{color:var(--usuzumi);font-size:14.5px;margin:6px 0 0}
.menu li.osusume .menu__name{color:var(--hatcho)}
.menu__tag{font-size:11px;font-weight:700;color:var(--kami);background:var(--hatcho);padding:1px 7px;border-radius:3px;margin-left:6px;vertical-align:3px;font-family:var(--gothic);letter-spacing:.05em}
.chuui{font-size:13px;color:var(--usuzumi);margin-top:16px}

/* らいてんのながれ */
.nagare{list-style:none;counter-reset:n;margin:0;padding:0}
.nagare li{counter-increment:n;position:relative;padding:0 0 26px 58px}
.nagare li::before{content:counter(n);position:absolute;left:0;top:0;width:40px;height:40px;border-radius:50%;
  background:var(--sumi);color:var(--kami);font-family:var(--mincho);font-weight:700;display:grid;place-items:center;font-size:18px}
.nagare li:not(:last-child)::after{content:"";position:absolute;left:19px;top:44px;bottom:4px;width:2px;background:var(--sen)}
.nagare h3{font-family:var(--mincho);font-size:18px;margin:4px 0 4px;letter-spacing:.05em}
.nagare p{font-size:15px;color:var(--usuzumi);margin:0}

/* みせのじょうほう */
.info{margin:0;display:grid;grid-template-columns:7em 1fr;border-top:1px solid var(--sen)}
.info dt,.info dd{padding:14px 0;border-bottom:1px solid var(--sen);margin:0}
.info dt{font-weight:700;font-size:14px;color:var(--usuzumi)}
.info dd{font-size:15px}
.links{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}
.links a{display:inline-block;padding:11px 18px;border:1.5px solid var(--sumi);border-radius:999px;color:var(--sumi);
  text-decoration:none;font-weight:700;font-size:14px}
.links a.main{background:var(--sumi);color:var(--kami)}

footer{background:var(--sumi);color:#C9D6E1;font-size:12.5px;line-height:1.8;padding:32px 22px calc(32px + env(safe-area-inset-bottom,0px));text-align:center}
footer .f-name{font-family:var(--mincho);font-size:20px;color:var(--kami);letter-spacing:.2em;margin-bottom:10px}
</style>
</head>
<body>

<header class="hero">
  <h1 class="hero__name" id="shopName"></h1>
  <div class="hero__side">
    <p class="hero__place" id="heroPlace"></p>
    <ul class="kodawari" id="kodawari"></ul>
  </div>
  <div class="hanko" id="hanko"></div>
</header>

<main>
  <section id="story" class="story">
    <h2>店のこと</h2>
    <div id="storyBody"></div>
    <div class="shou" id="awards"></div>
  </section>

  <section id="menu">
    <h2>お品書き</h2>
    <ul class="menu" id="menuList"></ul>
    <p class="chuui" id="menuNote"></p>
  </section>

  <section id="visit">
    <h2>ご来店の流れ</h2>
    <ol class="nagare" id="flow"></ol>
  </section>

  <section id="info">
    <h2>店舗情報</h2>
    <dl class="info" id="infoList"></dl>
    <div class="links" id="links"></div>
  </section>
</main>

<footer>
  <div class="f-name" id="footName"></div>
  <div id="footNote"></div>
</footer>

<script>
/* =====================================================
   ここから「データ」です。
   おみせの じょうほうを かえるときは ここだけ なおしてね。
   ===================================================== */
const SHOP = {
  // おみせの なまえ
  name: "麺屋",
  nameSub: "あきのそら",

  // いちばんうえに でる ばしょ と こだわり
  place: "愛知県 岡崎市 大門",
  kodawari: ["無化調", "自家製麺", "地産地消"],
  hanko: "令和元年<br>開店",

  // おみせの せつめい（1つ＝1だんらく）
  story: [
    "ラーメンの食べ歩きが大好きな店主が、2019年10月13日に岡崎市大門で開いたお店です。店名は、店主の名前「あきこ」にちなんでご主人が名付けました。",
    "化学調味料は使わず、麺は自家製。国産、とくに愛知県産の食材を多く使い、スープを飲み干しても体に負担の少ない一杯をめざしています。",
    "看板の塩は、野菜のだし、濃厚な貝のだし、節と昆布と煮干しのだしを合わせた、動物系を使わないスープ。地元岡崎の八丁味噌を使った味噌らーめんも人気です。"
  ],

  // うけた しょう
  awards: [
    "食べログ ラーメン AICHI 百名店 2025 選出",
    "TRYラーメン大賞 全国版 掲載"
  ],

  // メニュー（price を "" にすると「店頭にて」と でるよ）
  // osusume: true にすると あかい「看板」マークが つくよ
  menu: [
    { name: "淡麗魚貝しお", price: "980円", osusume: true,
      desc: "野菜・貝・節と昆布と煮干しの三つのだしを合わせた、動物系不使用の塩らーめん。" },
    { name: "岡崎八丁みそ", price: "980円", osusume: true,
      desc: "地元岡崎の八丁味噌に、節と昆布の和だしと野菜だしを合わせた一杯。温・冷あり（冷は時期による）。" },
    { name: "魚貝ブラック", price: "",
      desc: "魚貝だしをベースにした黒いスープのらーめん。" },
    { name: "背脂にぼし", price: "",
      desc: "煮干しのだしに背脂をきかせた一杯。" },
    { name: "極激辛拉麺 テンペスト", price: "3,000円",
      desc: "辛いもの好きのための変わり種。" },
    { name: "味玉", price: "150円", desc: "トッピング。" },
    { name: "チャーシュー丼", price: "",
      desc: "三河もち豚のチャーシューをのせたご飯もの。" }
  ],
  menuNote: "※価格・メニューはネット上の口コミ等を参考にしたもので、変更されている場合があります。限定メニューも随時あり。最新情報は公式X・Instagramでご確認ください。",

  // らいてんの ながれ（じゅんばん どおりに ならべてね）
  flow: [
    { title: "記名帳に名前を書く", text: "記名制です。平日・祝日は10時ごろ、土日は朝7時ごろに記名帳が出ます。" },
    { title: "呼ばれるまで待つ", text: "営業は11時から。1日の杯数に限りがあり（平日約70杯・土日約80杯）、なくなり次第終了です。" },
    { title: "券売機で食券を買う", text: "入口の券売機で。お支払いは現金のみです。" },
    { title: "カウンターへ", text: "カウンター席のみの小さなお店です。卓上の自家製八味唐辛子もお試しください（購入もできます）。" }
  ],

  // おみせの じょうほう（ひだり：こうもく、みぎ：なかみ）
  info: [
    ["住所", "〒444-2135<br>愛知県岡崎市大門3-20-15"],
    ["営業時間", "11:00〜14:00（L.O. 14:00）<br>なくなり次第終了"],
    ["定休日", "火曜・水曜"],
    ["席", "カウンター席のみ"],
    ["駐車場", "あり（共同駐車場 28台）"],
    ["アクセス", "愛知環状鉄道 大門駅から徒歩約15分"],
    ["支払い", "現金のみ（カード・電子マネー不可）"],
    ["予約", "不可（記名制）"],
    ["その他", "全席禁煙／お子さま連れOK"],
    ["電話", "なし"]
  ],

  // リンク（main: true は こいいろの ボタン）
  links: [
    { label: "地図を開く", url: "https://www.google.com/maps/search/?api=1&query=%E9%BA%BA%E5%B1%8B%E3%81%82%E3%81%8D%E3%81%AE%E3%81%9D%E3%82%89+%E5%B2%A1%E5%B4%8E%E5%B8%82%E5%A4%A7%E9%96%803-20-15", main: true },
    { label: "公式X", url: "https://x.com/menya_akinosora" },
    { label: "Instagram", url: "https://www.instagram.com/menya_akinosora/" },
    { label: "食べログ", url: "https://tabelog.com/aichi/A2305/A230502/23072129/" }
  ],

  footNote: "営業時間・定休日・価格は変更になる場合があります。<br>最新のお知らせは公式X・Instagramをご確認ください。"
};
/* ============ データ ここまで ============ */


/* =====================================================
   ここから「しくみ」です。ふだんは さわらなくて だいじょうぶ。
   ===================================================== */
const $ = (id) => document.getElementById(id);

// なまえ
$("shopName").innerHTML = `<small>${SHOP.name}</small>${SHOP.nameSub}`;
$("footName").textContent = `${SHOP.name} ${SHOP.nameSub}`;
document.title = `${SHOP.name} ${SHOP.nameSub} ｜ ${SHOP.place.replace(/ /g,"")}のらーめん店`;

// いちばんうえ
$("heroPlace").textContent = SHOP.place;
$("kodawari").innerHTML = SHOP.kodawari.map(k => `<li>${k}</li>`).join("");
$("hanko").innerHTML = SHOP.hanko;

// みせのこと
$("storyBody").innerHTML = SHOP.story.map(t => `<p>${t}</p>`).join("");
$("awards").innerHTML = SHOP.awards.map(a => `<p>${a}</p>`).join("");

// メニュー
$("menuList").innerHTML = SHOP.menu.map(m => `
  <li class="${m.osusume ? "osusume" : ""}">
    <div class="menu__row">
      <span class="menu__name">${m.name}${m.osusume ? '<span class="menu__tag">看板</span>' : ""}</span>
      <span class="menu__dots" aria-hidden="true"></span>
      <span class="menu__price">${m.price || "店頭にて"}</span>
    </div>
    ${m.desc ? `<p class="menu__desc">${m.desc}</p>` : ""}
  </li>`).join("");
$("menuNote").textContent = SHOP.menuNote;

// らいてんのながれ
$("flow").innerHTML = SHOP.flow.map(f => `<li><h3>${f.title}</h3><p>${f.text}</p></li>`).join("");

// じょうほう
$("infoList").innerHTML = SHOP.info.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("");

// リンク
$("links").innerHTML = SHOP.links.map(l =>
  `<a href="${l.url}" target="_blank" rel="noopener" class="${l.main ? "main" : ""}">${l.label}</a>`).join("");

// あしもと
$("footNote").innerHTML = SHOP.footNote;
</script>
</body>
</html>
